name: Проверка и публикация Pulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Проверка проекта
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверить JavaScript
        run: node --check script.js
      - name: Проверить Python
        run: python -m py_compile server.py
      - name: Проверить API и историю тестов
        run: python -m unittest discover -s tests -v
      - name: Проверить наличие файлов сайта
        run: |
          test -s index.html
          test -s style.css
          test -s script.js

  deploy:
    name: Публикация на GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Подготовить статический сайт
        run: |
          mkdir site
          cp index.html style.css script.js site/
      - name: Загрузить артефакт Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
